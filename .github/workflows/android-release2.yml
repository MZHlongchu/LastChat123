name: Android Release Build

on:
  push:
    tags:
      - "*zh*"
      - "*plus*"
      - "[0-9]*"

permissions:
  contents: write     

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Detect flavor from tag
        id: flavor
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"
          TAG_LOWER="$(printf '%s' "$TAG" | tr '[:upper:]' '[:lower:]')"

          has_zh=0
          has_plus=0
          if [[ "$TAG_LOWER" == *"zh"* ]]; then has_zh=1; fi
          if [[ "$TAG_LOWER" == *"plus"* ]]; then has_plus=1; fi

          if [[ $has_zh -eq 1 && $has_plus -eq 1 ]]; then
            echo "Tag contains both 'zh' and 'plus': $TAG"
            exit 1
          fi

          flavor="plus"
          if [[ $has_zh -eq 1 ]]; then
            flavor="zh"
          elif [[ $has_plus -eq 1 ]]; then
            flavor="plus"
          fi

          echo "flavor=$flavor" >> "$GITHUB_OUTPUT"
          echo "Detected flavor: $flavor (tag: $TAG)"

      ##### 创建零依赖的 Firebase Stub 类 #####
      - name: Create Firebase stub classes
        run: |
          mkdir -p "app/src/main/java/com/google/firebase/analytics"
          mkdir -p "app/src/main/java/com/google/firebase/remoteconfig"
          mkdir -p "app/src/main/java/com/google/firebase/crashlytics"
          mkdir -p "app/src/main/java/com/google/firebase"

          # 1. FirebaseAnalytics 类 + 扩展属性
          cat > "app/src/main/java/com/google/firebase/analytics/FirebaseAnalytics.kt" << 'EOF'
          package com.google.firebase.analytics
          import android.content.Context
          import android.os.Bundle
          import com.google.firebase.Firebase
          
          class FirebaseAnalytics private constructor() {
              companion object {
                  fun getInstance(): FirebaseAnalytics = FirebaseAnalytics()
                  fun getInstance(context: Context): FirebaseAnalytics = FirebaseAnalytics()
              }
              fun logEvent(key: String, bundle: Bundle?) {}
          }
          
          val Firebase.analytics: FirebaseAnalytics
              get() = FirebaseAnalytics.getInstance()
          EOF

          # 2. FirebaseRemoteConfig 类（无 Task 依赖，同步/空实现）
          cat > "app/src/main/java/com/google/firebase/remoteconfig/FirebaseRemoteConfig.kt" << 'EOF'
          package com.google.firebase.remoteconfig
          import com.google.firebase.Firebase
          
          class FirebaseRemoteConfig private constructor() {
              companion object {
                  fun getInstance(): FirebaseRemoteConfig = FirebaseRemoteConfig()
              }
              fun getString(key: String): String = ""
              fun getLong(key: String): Long = 0L
              fun getBoolean(key: String): Boolean = false
              fun getDouble(key: String): Double = 0.0
              fun setConfigSettingsAsync(settings: FirebaseRemoteConfigSettings) {}
              fun setDefaultsAsync(defaults: Map<String, Any>) {}
              fun setDefaultsAsync(resourceId: Int) {}
              fun fetchAndActivate(): Boolean = true
              fun activate(): Boolean = true
              val all: Map<String, Any> = emptyMap()
          }
          
          class FirebaseRemoteConfigSettings private constructor() {
              class Builder {
                  var minimumFetchIntervalInSeconds: Long = 3600
                  var fetchTimeoutInSeconds: Long = 60
                  
                  fun setMinimumFetchIntervalInSeconds(seconds: Long): Builder {
                      minimumFetchIntervalInSeconds = seconds
                      return this
                  }
                  fun setFetchTimeoutInSeconds(seconds: Long): Builder = this
                  fun build(): FirebaseRemoteConfigSettings = FirebaseRemoteConfigSettings()
              }
          }
          
          inline fun remoteConfigSettings(block: FirebaseRemoteConfigSettings.Builder.() -> Unit): FirebaseRemoteConfigSettings {
              return FirebaseRemoteConfigSettings.Builder().apply(block).build()
          }
          
          val Firebase.remoteConfig: FirebaseRemoteConfig
              get() = FirebaseRemoteConfig.getInstance()
          EOF

          # 3. FirebaseCrashlytics 类 + 扩展属性
          cat > "app/src/main/java/com/google/firebase/crashlytics/FirebaseCrashlytics.kt" << 'EOF'
          package com.google.firebase.crashlytics
          import com.google.firebase.Firebase
          
          class FirebaseCrashlytics private constructor() {
              companion object {
                  fun getInstance(): FirebaseCrashlytics = FirebaseCrashlytics()
              }
              fun logException(e: Throwable) {}
              fun log(msg: String) {}
              fun setUserId(id: String) {}
              fun setCustomKey(key: String, value: String) {}
              fun setCustomKey(key: String, value: Boolean) {}
              fun setCustomKey(key: String, value: Int) {}
              fun setCustomKey(key: String, value: Double) {}
              fun recordException(e: Throwable) {}
          }
          
          val Firebase.crashlytics: FirebaseCrashlytics
              get() = FirebaseCrashlytics.getInstance()
          EOF

          # 4. FirebaseApp 和 Firebase 对象
          cat > "app/src/main/java/com/google/firebase/FirebaseApp.kt" << 'EOF'
          package com.google.firebase
          import android.content.Context
          
          class FirebaseApp private constructor() {
              companion object {
                  fun getInstance(): FirebaseApp = FirebaseApp()
                  fun getInstance(name: String): FirebaseApp = FirebaseApp()
                  fun initializeApp(context: Context): FirebaseApp? = null
                  fun initializeApp(context: Context, options: Any): FirebaseApp? = null
              }
          }
          
          object Firebase {
              val app: FirebaseApp get() = FirebaseApp.getInstance()
          }
          EOF
          
          echo "✅ Created zero-dependency Firebase stub classes"

      ##### 彻底移除所有 Firebase 和 Google 服务依赖（关键修复：使用 grep -v 确保完全移除）#####
      - name: Remove all Firebase and Google Services dependencies
        run: |
          APP_BUILD_FILE="app/build.gradle.kts"
          ROOT_BUILD_FILE="build.gradle.kts"
          TOML_FILE="gradle/libs.versions.toml"
          
          # 1. 移除 app/build.gradle.kts 中的 Firebase 库引用
          sed -i '/platform(libs\.firebase\.bom)/d' "$APP_BUILD_FILE"
          sed -i '/implementation(libs\.firebase\.[^)]*)/d' "$APP_BUILD_FILE"
          
          # 2. 关键修复：使用 grep -v 完全重建文件，移除所有 Firebase/Google 插件引用
          # 处理 app/build.gradle.kts
          grep -v "alias(libs.plugins.google.services)" "$APP_BUILD_FILE" > "$APP_BUILD_FILE.tmp"
          mv "$APP_BUILD_FILE.tmp" "$APP_BUILD_FILE"
          grep -v "alias(libs.plugins.firebase.crashlytics)" "$APP_BUILD_FILE" > "$APP_BUILD_FILE.tmp"
          mv "$APP_BUILD_FILE.tmp" "$APP_BUILD_FILE"
          
          # 3. 关键修复：处理根目录 build.gradle.kts
          grep -v "alias(libs.plugins.google.services)" "$ROOT_BUILD_FILE" > "$ROOT_BUILD_FILE.tmp"
          mv "$ROOT_BUILD_FILE.tmp" "$ROOT_BUILD_FILE"
          grep -v "alias(libs.plugins.firebase.crashlytics)" "$ROOT_BUILD_FILE" > "$ROOT_BUILD_FILE.tmp"
          mv "$ROOT_BUILD_FILE.tmp" "$ROOT_BUILD_FILE"
          
          # 4. 从 libs.versions.toml 中移除 Firebase 库定义
          grep -v 'firebase-bom = { group = "com.google.firebase"' "$TOML_FILE" > "$TOML_FILE.tmp"
          mv "$TOML_FILE.tmp" "$TOML_FILE"
          grep -v 'firebase-analytics = { group = "com.google.firebase"' "$TOML_FILE" > "$TOML_FILE.tmp"
          mv "$TOML_FILE.tmp" "$TOML_FILE"
          grep -v 'firebase-crashlytics = { group = "com.google.firebase"' "$TOML_FILE" > "$TOML_FILE.tmp"
          mv "$TOML_FILE.tmp" "$TOML_FILE"
          grep -v 'firebase-config = { group = "com.google.firebase"' "$TOML_FILE" > "$TOML_FILE.tmp"
          mv "$TOML_FILE.tmp" "$TOML_FILE"
          
          # 5. 从 libs.versions.toml 中移除 plugins 部分的 Firebase 插件定义
          grep -v 'google-services = { id = "com.google.gms.google-services"' "$TOML_FILE" > "$TOML_FILE.tmp"
          mv "$TOML_FILE.tmp" "$TOML_FILE"
          grep -v 'firebase-crashlytics = { id = "com.google.firebase.crashlytics"' "$TOML_FILE" > "$TOML_FILE.tmp"
          mv "$TOML_FILE.tmp" "$TOML_FILE"
          
          # 6. 移除 versions 部分的 firebase 版本号定义
          grep -v '^firebase-bom = "' "$TOML_FILE" > "$TOML_FILE.tmp"
          mv "$TOML_FILE.tmp" "$TOML_FILE"
          grep -v '^firebase-crashlytics = "' "$TOML_FILE" > "$TOML_FILE.tmp"
          mv "$TOML_FILE.tmp" "$TOML_FILE"
          grep -v '^google-services = "' "$TOML_FILE" > "$TOML_FILE.tmp"
          mv "$TOML_FILE.tmp" "$TOML_FILE"
          
          echo "✅ All Firebase dependencies and plugins removed from all files"

      ##### 创建空的 google-services.json（占位，防止路径检查错误）#####
      - name: Create placeholder google-services.json
        run: |
          FLAVOR="${{ steps.flavor.outputs.flavor }}"
          mkdir -p "app/src/$FLAVOR"
          
          # 最小化占位文件
          cat > "app/src/$FLAVOR/google-services.json" << 'EOF'
          {"project_info":{"project_number":"0","project_id":"dummy","storage_bucket":"dummy"},"client":[{"client_info":{"mobilesdk_app_id":"0","android_client_info":{"package_name":"dummy"}},"oauth_client":[],"api_key":[],"services":{}}],"configuration_version":"1"}
          EOF
          
          echo "✅ Created placeholder google-services.json for $FLAVOR"

      - name: Prepare signing config
        run: |
          if [ -n "${{ secrets.KEY_BASE64 }}" ]; then
            echo "${{ secrets.KEY_BASE64 }}" | base64 -d > app/app.key
          fi

          if [ -n "${{ secrets.SIGNING_CONFIG }}" ]; then
            echo "${{ secrets.SIGNING_CONFIG }}" > local.properties
          fi

      - name: Gradle Build Release
        run: |
          set -euo pipefail
          chmod +x gradlew

          FLAVOR="${{ steps.flavor.outputs.flavor }}"
          FLAVOR_CAP="${FLAVOR^}"
          TASK="assemble${FLAVOR_CAP}Release"

          echo "Building release APK ($TASK)..."
          ./gradlew ":app:$TASK" --no-daemon --stacktrace

      - name: Upload build output (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-${{ steps.flavor.outputs.flavor }}
          path: app/build/outputs/apk/${{ steps.flavor.outputs.flavor }}/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/${{ steps.flavor.outputs.flavor }}/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

