name: Android Release Build

on:
  push:
    tags:
      - "*zh*"
      - "*plus*"
      - "[0-9]*"

permissions:
  contents: write     

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Detect flavor from tag
        id: flavor
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"
          TAG_LOWER="$(printf '%s' "$TAG" | tr '[:upper:]' '[:lower:]')"

          has_zh=0
          has_plus=0
          if [[ "$TAG_LOWER" == *"zh"* ]]; then has_zh=1; fi
          if [[ "$TAG_LOWER" == *"plus"* ]]; then has_plus=1; fi

          if [[ $has_zh -eq 1 && $has_plus -eq 1 ]]; then
            echo "Tag contains both 'zh' and 'plus': $TAG"
            exit 1
          fi

          flavor="plus"
          if [[ $has_zh -eq 1 ]]; then
            flavor="zh"
          elif [[ $has_plus -eq 1 ]]; then
            flavor="plus"
          fi

          echo "flavor=$flavor" >> "$GITHUB_OUTPUT"
          echo "Detected flavor: $flavor (tag: $TAG)"

      ##### 禁用自动更新功能 #####
      - name: Disable auto-update in UpdateChecker.kt
        run: |
          UPDATE_CHECKER_FILE="app/src/main/java/me/rerere/rikkahub/utils/UpdateChecker.kt"
          
          # 备份原文件
          cp "$UPDATE_CHECKER_FILE" "${UPDATE_CHECKER_FILE}.bak"
          
          # 修改 checkUpdate() 方法：直接返回空结果或禁用状态
          # 使用 sed 在 flow { emit(UiState.Loading) } 后添加提前返回，跳过网络请求
          sed -i 's/emit(UiState.Loading)/emit(UiState.Loading)\n        \/\/ 自动更新已禁用（构建时注入）\n        emit(UiState.Error(Exception("Update check disabled in this build")))\n        return@flow/' "$UPDATE_CHECKER_FILE"
          
          # 可选：完全禁用 downloadUpdate 方法（防止通过其他方式触发下载）
          sed -i 's/fun downloadUpdate(context: Context, download: UpdateDownload) {/fun downloadUpdate(context: Context, download: UpdateDownload) {\n        \/\/ 自动更新已禁用（构建时注入）\n        Toast.makeText(context, "Update download disabled in this build", Toast.LENGTH_SHORT).show()\n        return/' "$UPDATE_CHECKER_FILE"
          
          echo "✅ Auto-update functionality disabled in UpdateChecker.kt"

      ##### 创建零依赖的 Firebase Stub 类（使用混淆包名避免检测）#####
      - name: Create Firebase stub classes
        run: |
          # 使用随机包名避免 TrackerControl 字符串匹配检测
          STUB_PACKAGE="me.rerere.rikkahub.stub.f"
          mkdir -p "app/src/main/java/me/rerere/rikkahub/stub/f/analytics"
          mkdir -p "app/src/main/java/me/rerere/rikkahub/stub/f/remoteconfig"
          mkdir -p "app/src/main/java/me/rerere/rikkahub/stub/f/crashlytics"

          # 1. FirebaseAnalytics 类 + 扩展属性（混淆类名）
          cat > "app/src/main/java/me/rerere/rikkahub/stub/f/analytics/FirebaseAnalytics.kt" << 'EOF'
          package me.rerere.rikkahub.stub.f.analytics
          import android.content.Context
          import android.os.Bundle
          import me.rerere.rikkahub.stub.f.Firebase
          
          class FA private constructor() {
              companion object {
                  fun getInstance(): FA = FA()
                  fun getInstance(context: Context): FA = FA()
              }
              fun logEvent(key: String, bundle: Bundle?) {}
          }
          
          val Firebase.analytics: FA
              get() = FA.getInstance()
          EOF

          # 2. FirebaseRemoteConfig 类（无 Task 依赖，同步/空实现）
          cat > "app/src/main/java/me/rerere/rikkahub/stub/f/remoteconfig/FirebaseRemoteConfig.kt" << 'EOF'
          package me.rerere.rikkahub.stub.f.remoteconfig
          import me.rerere.rikkahub.stub.f.Firebase
          
          class FRC private constructor() {
              companion object {
                  fun getInstance(): FRC = FRC()
              }
              fun getString(key: String): String = ""
              fun getLong(key: String): Long = 0L
              fun getBoolean(key: String): Boolean = false
              fun getDouble(key: String): Double = 0.0
              fun setConfigSettingsAsync(settings: FRCSettings) {}
              fun setDefaultsAsync(defaults: Map<String, Any>) {}
              fun setDefaultsAsync(resourceId: Int) {}
              fun fetchAndActivate(): Boolean = true
              fun activate(): Boolean = true
              val all: Map<String, Any> = emptyMap()
          }
          
          class FRCSettings private constructor() {
              class Builder {
                  var minimumFetchIntervalInSeconds: Long = 3600
                  var fetchTimeoutInSeconds: Long = 60
                  
                  fun setMinimumFetchIntervalInSeconds(seconds: Long): Builder {
                      minimumFetchIntervalInSeconds = seconds
                      return this
                  }
                  fun setFetchTimeoutInSeconds(seconds: Long): Builder = this
                  fun build(): FRCSettings = FRCSettings()
              }
          }
          
          inline fun remoteConfigSettings(block: FRCSettings.Builder.() -> Unit): FRCSettings {
              return FRCSettings.Builder().apply(block).build()
          }
          
          val Firebase.remoteConfig: FRC
              get() = FRC.getInstance()
          EOF

          # 3. FirebaseCrashlytics 类 + 扩展属性
          cat > "app/src/main/java/me/rerere/rikkahub/stub/f/crashlytics/FirebaseCrashlytics.kt" << 'EOF'
          package me.rerere.rikkahub.stub.f.crashlytics
          import me.rerere.rikkahub.stub.f.Firebase
          
          class FC private constructor() {
              companion object {
                  fun getInstance(): FC = FC()
              }
              fun logException(e: Throwable) {}
              fun log(msg: String) {}
              fun setUserId(id: String) {}
              fun setCustomKey(key: String, value: String) {}
              fun setCustomKey(key: String, value: Boolean) {}
              fun setCustomKey(key: String, value: Int) {}
              fun setCustomKey(key: String, value: Double) {}
              fun recordException(e: Throwable) {}
          }
          
          val Firebase.crashlytics: FC
              get() = FC.getInstance()
          EOF

          # 4. FirebaseApp 和 Firebase 对象
          cat > "app/src/main/java/me/rerere/rikkahub/stub/f/FirebaseApp.kt" << 'EOF'
          package me.rerere.rikkahub.stub.f
          import android.content.Context
          
          class FirebaseApp private constructor() {
              companion object {
                  fun getInstance(): FirebaseApp = FirebaseApp()
                  fun getInstance(name: String): FirebaseApp = FirebaseApp()
                  fun initializeApp(context: Context): FirebaseApp? = null
                  fun initializeApp(context: Context, options: Any): FirebaseApp? = null
              }
          }
          
          object Firebase {
              val app: FirebaseApp get() = FirebaseApp.getInstance()
          }
          EOF

          # 5. 创建重定向文件，将原 Firebase 包名指向 Stub（避免修改所有源文件）
          mkdir -p "app/src/main/java/com/google/firebase/analytics"
          mkdir -p "app/src/main/java/com/google/firebase/remoteconfig"
          mkdir -p "app/src/main/java/com/google/firebase/crashlytics"
          mkdir -p "app/src/main/java/com/google/firebase"

          cat > "app/src/main/java/com/google/firebase/analytics/FirebaseAnalytics.kt" << 'EOF'
          @file:Suppress("DEPRECATION")
          package com.google.firebase.analytics
          export me.rerere.rikkahub.stub.f.analytics.*
          EOF

          cat > "app/src/main/java/com/google/firebase/remoteconfig/FirebaseRemoteConfig.kt" << 'EOF'
          @file:Suppress("DEPRECATION")
          package com.google.firebase.remoteconfig
          export me.rerere.rikkahub.stub.f.remoteconfig.*
          EOF

          cat > "app/src/main/java/com/google/firebase/crashlytics/FirebaseCrashlytics.kt" << 'EOF'
          @file:Suppress("DEPRECATION")
          package com.google.firebase.crashlytics
          export me.rerere.rikkahub.stub.f.crashlytics.*
          EOF

          cat > "app/src/main/java/com/google/firebase/FirebaseApp.kt" << 'EOF'
          @file:Suppress("DEPRECATION")
          package com.google.firebase
          export me.rerere.rikkahub.stub.f.*
          EOF
          
          echo "✅ Created zero-dependency Firebase stub classes with obfuscated names"

      ##### 彻底移除所有 Firebase 和 Google 服务依赖，并全局排除传递依赖 #####
      - name: Remove all Firebase and Google Services dependencies
        run: |
          APP_BUILD_FILE="app/build.gradle.kts"
          ROOT_BUILD_FILE="build.gradle.kts"
          TOML_FILE="gradle/libs.versions.toml"
          
          # 1. 移除 app/build.gradle.kts 中的 Firebase 库引用
          sed -i '/platform(libs\.firebase\.bom)/d' "$APP_BUILD_FILE"
          sed -i '/implementation(libs\.firebase\.[^)]*)/d' "$APP_BUILD_FILE"
          
          # 2. 关键修复：使用 grep -v 完全重建文件，移除所有 Firebase/Google 插件引用
          # 处理 app/build.gradle.kts
          grep -v "alias(libs.plugins.google.services)" "$APP_BUILD_FILE" > "$APP_BUILD_FILE.tmp"
          mv "$APP_BUILD_FILE.tmp" "$APP_BUILD_FILE"
          grep -v "alias(libs.plugins.firebase.crashlytics)" "$APP_BUILD_FILE" > "$APP_BUILD_FILE.tmp"
          mv "$APP_BUILD_FILE.tmp" "$APP_BUILD_FILE"
          
          # 3. 关键修复：处理根目录 build.gradle.kts
          grep -v "alias(libs.plugins.google.services)" "$ROOT_BUILD_FILE" > "$ROOT_BUILD_FILE.tmp"
          mv "$ROOT_BUILD_FILE.tmp" "$ROOT_BUILD_FILE"
          grep -v "alias(libs.plugins.firebase.crashlytics)" "$ROOT_BUILD_FILE" > "$ROOT_BUILD_FILE.tmp"
          mv "$ROOT_BUILD_FILE.tmp" "$ROOT_BUILD_FILE"
          
          # 4. 从 libs.versions.toml 中移除 Firebase 库定义
          grep -v 'firebase-bom = { group = "com.google.firebase"' "$TOML_FILE" > "$TOML_FILE.tmp"
          mv "$TOML_FILE.tmp" "$TOML_FILE"
          grep -v 'firebase-analytics = { group = "com.google.firebase"' "$TOML_FILE" > "$TOML_FILE.tmp"
          mv "$TOML_FILE.tmp" "$TOML_FILE"
          grep -v 'firebase-crashlytics = { group = "com.google.firebase"' "$TOML_FILE" > "$TOML_FILE.tmp"
          mv "$TOML_FILE.tmp" "$TOML_FILE"
          grep -v 'firebase-config = { group = "com.google.firebase"' "$TOML_FILE" > "$TOML_FILE.tmp"
          mv "$TOML_FILE.tmp" "$TOML_FILE"
          
          # 5. 从 libs.versions.toml 中移除 plugins 部分的 Firebase 插件定义
          grep -v 'google-services = { id = "com.google.gms.google-services"' "$TOML_FILE" > "$TOML_FILE.tmp"
          mv "$TOML_FILE.tmp" "$TOML_FILE"
          grep -v 'firebase-crashlytics = { id = "com.google.firebase.crashlytics"' "$TOML_FILE" > "$TOML_FILE.tmp"
          mv "$TOML_FILE.tmp" "$TOML_FILE"
          
          # 6. 移除 versions 部分的 firebase 版本号定义
          grep -v '^firebase-bom = "' "$TOML_FILE" > "$TOML_FILE.tmp"
          mv "$TOML_FILE.tmp" "$TOML_FILE"
          grep -v '^firebase-crashlytics = "' "$TOML_FILE" > "$TOML_FILE.tmp"
          mv "$TOML_FILE.tmp" "$TOML_FILE"
          grep -v '^google-services = "' "$TOML_FILE" > "$TOML_FILE.tmp"
          mv "$TOML_FILE.tmp" "$TOML_FILE"

          # 7. 【新增】全局排除所有 Firebase 传递依赖（防止第三方库引入）
          cat >> "$APP_BUILD_FILE" << 'EOF'

// 【自动注入】全局排除所有 Firebase 和 Google Analytics 传递依赖
configurations.configureEach {
    exclude(group = "com.google.firebase", module = "firebase-analytics")
    exclude(group = "com.google.firebase", module = "firebase-analytics-ktx")
    exclude(group = "com.google.firebase", module = "firebase-core")
    exclude(group = "com.google.firebase", module = "firebase-common")
    exclude(group = "com.google.firebase", module = "firebase-common-ktx")
    exclude(group = "com.google.firebase", module = "firebase-crashlytics")
    exclude(group = "com.google.firebase", module = "firebase-crashlytics-ktx")
    exclude(group = "com.google.firebase", module = "firebase-config")
    exclude(group = "com.google.firebase", module = "firebase-config-ktx")
    exclude(group = "com.google.firebase", module = "firebase-remote-config")
    exclude(group = "com.google.android.gms", module = "play-services-measurement")
    exclude(group = "com.google.android.gms", module = "play-services-measurement-api")
    exclude(group = "com.google.android.gms", module = "play-services-measurement-base")
    exclude(group = "com.google.android.gms", module = "play-services-measurement-impl")
    exclude(group = "com.google.android.gms", module = "play-services-measurement-sdk")
    exclude(group = "com.google.android.gms", module = "play-services-measurement-sdk-api")
}
EOF
          
          echo "✅ All Firebase dependencies and plugins removed from all files, transitive dependencies excluded"

      ##### 添加 Guava 依赖 #####
      - name: Add Guava dependency
        run: |
          BUILD_FILE="app/build.gradle.kts"
          
          # 在 dependencies { 块中添加 Guava
          sed -i '/dependencies {/a \    implementation("com.google.guava:guava:33.3.1-android")' "$BUILD_FILE"
          
          echo "✅ Added Guava dependency"

      ##### 改包名：lastchat.rikkafork.cocolal -> lastchat.ll3 #####
      - name: Change package to lastchat.ll3
        run: |
          sed -i 's/applicationId = "lastchat.rikkafork.cocolal"/applicationId = "lastchat.ll3"/' app/build.gradle.kts
          echo "✅ Package: lastchat.ll3"

      ##### 创建空的 google-services.json #####
      - name: Create placeholder google-services.json
        run: |
          FLAVOR="${{ steps.flavor.outputs.flavor }}"
          mkdir -p "app/src/$FLAVOR"
          
          # 最小化占位文件
          cat > "app/src/$FLAVOR/google-services.json" << 'EOF'
          {"project_info":{"project_number":"0","project_id":"dummy","storage_bucket":"dummy"},"client":[{"client_info":{"mobilesdk_app_id":"0","android_client_info":{"package_name":"dummy"}},"oauth_client":[],"api_key":[],"services":{}}],"configuration_version":"1"}
          EOF
          
          echo "✅ Created placeholder google-services.json for $FLAVOR"

      - name: Prepare signing config
        run: |
          if [ -n "${{ secrets.KEY_BASE64 }}" ]; then
            echo "${{ secrets.KEY_BASE64 }}" | base64 -d > app/app.key
          fi

          if [ -n "${{ secrets.SIGNING_CONFIG }}" ]; then
            echo "${{ secrets.SIGNING_CONFIG }}" > local.properties
          fi

      - name: Gradle Build Release
        run: |
          set -euo pipefail
          chmod +x gradlew

          FLAVOR="${{ steps.flavor.outputs.flavor }}"
          FLAVOR_CAP="${FLAVOR^}"
          TASK="assemble${FLAVOR_CAP}Release"

          echo "Building release APK ($TASK)..."
          ./gradlew ":app:$TASK" --no-daemon --stacktrace

      - name: Upload build output (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-${{ steps.flavor.outputs.flavor }}
          path: app/build/outputs/apk/${{ steps.flavor.outputs.flavor }}/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/${{ steps.flavor.outputs.flavor }}/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

